{% extends "base.html" %}

{% block title %}تغییر رمز عبور | TaskFlow{% endblock %}

{% block content %}
<div class="form-page page-width">
    <section class="form-card">
        <div class="form-card-icon" aria-hidden="true">◇</div>
        <div class="card-heading">
            <p class="eyebrow">امنیت حساب</p>
            <h1>تغییر رمز عبور</h1>
            <p>برای محافظت از حساب، یک رمز عبور قوی و منحصربه‌فرد انتخاب کنید.</p>
        </div>
        <form method="post" novalidate>
            {% csrf_token %}
            {% include "accounts/_form.html" %}
            <button class="button button-block button-large" type="submit">به‌روزرسانی رمز عبور</button>
        </form>
        <a class="back-link" href="{% url 'accounts:profile' %}"><span aria-hidden="true">→</span> بازگشت به پروفایل</a>
    </section>
</div>
{% endblock %}
