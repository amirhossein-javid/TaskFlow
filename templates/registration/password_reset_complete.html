{% extends "base.html" %}

{% block content %}

    <section class="status-card">
        <div class="success-mark" aria-hidden="true"><span>✓</span></div>
        <p class="eyebrow">دسترسی بازیابی شد</p>
        <h1>رمز عبور جدید ذخیره شد</h1>

        <a class="button button-large" href="{% url 'accounts:login' %}">ورود به حساب <span aria-hidden="true">←</span></a>
    </section>
</div>
{% endblock %}
