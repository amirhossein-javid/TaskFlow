{% extends "base.html" %}

{% block title %}بازیابی رمز عبور | TaskFlow{% endblock %}

{% block content %}
<section class="auth-card">
    <p class="eyebrow">بازیابی حساب</p>
    <h1>بازیابی رمز عبور</h1>
    <p class="muted">ایمیل حساب خود را وارد کنید تا لینک امن بازیابی برای شما ارسال شود.</p>
    <form method="post" novalidate>
        {% csrf_token %}
        {% include "accounts/_form.html" %}
        <button class="button button-block" type="submit">ارسال لینک بازیابی</button>
    </form>
</section>
{% endblock %}
