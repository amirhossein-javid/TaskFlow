{% extends "base.html" %}
{% block title %}{{ heading }} | TaskFlow{% endblock %}
{% block content %}
<section class="workspace-page page-width">
    {% if task %}<a class="back-link" href="{% url 'boards:task_detail' workspace.slug project.pk task.pk %}">→ بازگشت به وظیفه</a>{% else %}<a class="back-link" href="{% url 'boards:detail' workspace.slug project.pk %}">→ بازگشت به برد</a>{% endif %}
    <div class="collaboration-card task-form-card">
        <h1>{{ heading }}</h1>
        <form method="post">
            {% csrf_token %}
            {% include "accounts/_form.html" %}
            <button class="button" type="submit">ذخیره</button>
        </form>
    </div>
</section>
{% endblock %}
