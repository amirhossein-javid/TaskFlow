{% extends "base.html" %}
{% block title %}حذف عضو | TaskFlow{% endblock %}
{% block content %}<section class="form-page page-width"><div class="form-card confirmation-card"><div class="card-heading"><h1>حذف عضو</h1><p>آیا از حذف <strong>{{ target.user.profile.full_name|default:target.user.email }}</strong> از «{{ workspace.name }}» مطمئن هستید؟</p></div><form method="post">{% csrf_token %}<div class="form-actions"><button class="button button-danger" type="submit">بله، حذف شود</button><a class="button button-ghost" href="{% url 'workspaces:members' workspace.slug %}">انصراف</a></div></form></div></section>{% endblock %}
