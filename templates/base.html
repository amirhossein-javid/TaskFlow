{% load static %}
<!doctype html>
<html lang="fa-IR" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}TaskFlow{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
    <header class="site-header">
        <nav class="nav container-wide" aria-label="ناوبری اصلی">
            <a class="brand" href="{% url 'home' %}">TaskFlow</a>
            <div class="nav-links">
                {% if user.is_authenticated %}
                    <a href="{% url 'accounts:profile' %}">پروفایل</a>
                    <a href="{% url 'accounts:password_change' %}">تغییر رمز عبور</a>
                    <form method="post" action="{% url 'accounts:logout' %}">
                        {% csrf_token %}
                        <button class="link-button" type="submit">خروج</button>
                    </form>
                {% else %}
                    <a href="{% url 'accounts:login' %}">ورود</a>
                    <a class="button button-small" href="{% url 'accounts:register' %}">ساخت حساب</a>
                {% endif %}
            </div>
        </nav>
    </header>
    <main class="container">
        {% if messages %}
            <div class="messages" aria-live="polite">
                {% for message in messages %}
                    <div class="message message-{{ message.tags|default:'info' }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
